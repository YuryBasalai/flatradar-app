<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FlatRadar BY</title>
</head>
<body>
<!--
	Загрузчик: этот файл не меняется, поэтому кэш Telegram (особенно на iOS) ему не страшен.
	Само приложение — app.html — каждый раз скачивается свежим.
-->
<script>
fetch("app.html?v=" + Date.now(), { cache: "no-store" })
	.then((r) => r.text())
	.then((html) => {
		document.open();
		document.write(html);
		document.close();
	})
	.catch(() => {
		document.body.textContent = "Не удалось загрузить. Проверьте интернет и откройте снова.";
	});
</script>
</body>
</html>
